name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, for example v0.3.12'
        required: true

permissions:
  contents: write

env:
  SIGNER_CERT_SHA256: 6c15d79098eea9e0b2d01ec35bd26fff8d0ae255f435fd077ec5fbf1985031f2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: release_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tag with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_tag.outputs.name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/module-api

      - name: Require versioned release notes and a new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.name }}
        run: |
          python3 scripts/verify_release_notes.py --tag "$TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This tag already has a Release. Publish a new version instead of replacing assets.' >&2
            exit 1
          fi

      # One-time wording migration authorized for this release; remove after verification.
      - name: Update historical release wording
        if: steps.release_tag.outputs.name == 'v1.2.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          endpoint = f'repos/{repo}/releases/tags/v1.1.0'
          def get(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True, encoding='utf-8'))
          def assets(release):
              return sorted((a['id'], a['name'], a['size'], a.get('digest')) for a in release['assets'])
          before = get(endpoint)
          report = Path('build/release/history-wording-verification.json')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps({'before': before}, ensure_ascii=False, indent=2), encoding='utf-8')
          body = before['body'].replace('界面现代化与 Pixel Text 动效对齐完成', '界面与现代动效适配完成')
          body = body.replace('**Pixel Text 动效**', '**现代动效**')
          assert not re.search(r'pixel\s*text', body, re.I)
          assert len(body.splitlines()) <= 40
          if body != before['body']:
              subprocess.run(['gh', 'api', '--method', 'PATCH', f"repos/{repo}/releases/{before['id']}", '--input', '-'],
                             input=json.dumps({'body': body}), text=True, check=True, stdout=subprocess.DEVNULL)
          after = get(endpoint)
          assert after['body'] == body
          assert assets(before) == assets(after)
          for field in ['id', 'name', 'tag_name', 'draft', 'prerelease', 'target_commitish']:
              assert before[field] == after[field]
          report.write_text(json.dumps({'before': before, 'after': after, 'assetsUnchanged': True},
                                       ensure_ascii=False, indent=2), encoding='utf-8')
          print('Historical wording updated; asset IDs, names, sizes and digests preserved.')
          PY

      - name: Preserve historical wording verification
        if: always() && steps.release_tag.outputs.name == 'v1.2.0'
        uses: actions/upload-artifact@v4.6.0
        with:
          name: release-wording-verification
          path: build/release/history-wording-verification.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MIPUSH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "MIPUSH_KEYSTORE_BASE64 is not configured for this repository." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mipushframework-release.p12"
          echo "decoded keystore: $(stat -c %s "$RUNNER_TEMP/mipushframework-release.p12") bytes"

      - name: Build the signed Release APKs
        env:
          MIPUSH_KEYSTORE_FILE: ${{ runner.temp }}/mipushframework-release.p12
          MIPUSH_KEYSTORE_PASSWORD: ${{ secrets.MIPUSH_KEYSTORE_PASSWORD }}
          MIPUSH_KEY_ALIAS: ${{ secrets.MIPUSH_KEY_ALIAS }}
          MIPUSH_KEY_PASSWORD: ${{ secrets.MIPUSH_KEY_PASSWORD }}
          TAG: ${{ steps.release_tag.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew :push:assembleNormalRelease :push:assembleVc105Release \
            -PversionName="${TAG#v}" --stacktrace

      - name: Stage named APKs, checksums and build information
        env:
          TAG: ${{ steps.release_tag.outputs.name }}
        run: |
          shopt -s nullglob
          normal=(push/build/outputs/apk/normal/release/*-release.apk)
          vc105=(push/build/outputs/apk/vc105/release/*-release.apk)
          test "${#normal[@]}" -eq 1 && test "${#vc105[@]}" -eq 1
          python3 scripts/prepare_release.py --tag "$TAG" \
            --project PixelMiPushFramework --repository "$GITHUB_REPOSITORY" \
            --certificate "$SIGNER_CERT_SHA256" --tools "$ANDROID_HOME/build-tools/36.0.0" \
            --apk "normal=${normal[0]}" --apk "vc105=${vc105[0]}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.name }}
        run: |
          release_args=()
          if [[ "$TAG" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" "${release_args[@]}" --notes-file build/release/release-notes.md dist/*.apk dist/*.sha256

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mipushframework-release.p12"
