name: Build Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install APK verification tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned Release APK and hook artifacts
        run: |
          chmod +x gradlew
          ./gradlew :push:assembleNormalRelease :mipush_hook:assemble \
            -PversionName=build-${GITHUB_SHA} --stacktrace

      - name: Verify SDK and aspects in final AARs
        run: |
          python3 scripts/verify_hook_artifact.py mipush_hook/build/outputs/aar/*.aar \
            > hook-artifact-results.json

      - name: Verify final unsigned APK
        run: |
          python3 scripts/verify_apk_artifact.py \
            push/build/outputs/apk/normal/release/*-unsigned.apk \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            > apk-artifact-results.json

      - name: Upload verification reports
        uses: actions/upload-artifact@v4.6.0
        with:
          name: build-artifact-verification
          path: |
            hook-artifact-results.json
            apk-artifact-results.json
          if-no-files-found: error
